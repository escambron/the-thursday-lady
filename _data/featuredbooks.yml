  blurbs:
  - author: Nnenna Freelon
    creds:  Seven time Grammy Nominee; author of <u>Beneath the Skin of Sorrow</u>; host of podcast “Great Grief”
    text: >      
      ...beautifully set inside the flesh and bones of an elderly ladies’ book club. Karla Holloway is a weaver a dreams with a decidedly feminine gaze. Her storytelling is a splendid sistering song that layers literature, political power, race, and terrible trouble—all set in the embrace of sisterhood.
  - author: Brenda M. Greene
    creds:  Professor, CUNY; Founder and Executive Director Emerita of Center for Black Literature  	   
    text: >
      ...a gripping mystery that keeps readers bound to its pages. Readers will come away understanding community and the value of sisterhood. Karla Holloway has once again written a novel that mirrors reality.
  - author: Farah Jasmine Griffin
    creds: University Professor, Columbia University; author of <u>Read Until You Understand</u>   
    text: >
      As with the ladies of this captivating novel, its author, Karla Holloway is a reader.  Fortunately for us, she is an extraordinary writer as well.  These two skills come together on the pages of <u>The Thursday Lady</u>, a book that will captivate you from the first page, a book steeped in history but speaking most forcefully to our times.  With the unexpected energy of a classic thriller, this is a book that asks us to reconsider what we thought we know about justice, grace and mercy while reflecting on the power of black women’s bonds to each other.     
  - author: Bernice L. McFadden
    creds:  author of <u>Sugar</u>
    text: >      
      ...part political thriller, part spiritual reckoning. A brilliant story about inheritance, memory, power, and the impossible choices that arise when a country refuses to confront its original sin.
  - author: Dana Williams, Ph.D.
    creds:  author of NYT bestseller <u>Toni at Random</u>; Dean and Professor, Howard University
    text: >
      Imagine a novel with a Harlem Renaissance savoir-faire and a twenty-first century sensibility. Karla FC Holloway's <u>The Thursday Lady</u> is just that! Full of wit and candor, the novel has that rare ability to move effortlessly between playfulness and seriousness—to make you laugh, think, and then exhale. Its world feels at once familiar and entirely its own. <u>The Thursday Lady</u> is the kind of book that makes you hope for a rainy day so you can curl up somewhere comfortable, with nowhere else to be, and just read. Even then, the characters will stay with you long after you've turned the last page. 
